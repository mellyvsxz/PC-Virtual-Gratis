name: Virtual PC Online

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        description: 'Defina uma senha para o usuário (ou conexão)'
        required: true
        default: '123456'

jobs:
  desktop-test:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # mantém a máquina ligada por até 6 horas

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar desktop e VNC
        run: |
          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            tigervnc-standalone-server \
            tigervnc-common \
            dbus-x11 \
            curl

      - name: Configurar VNC
        env:
          VNC_PASSWORD: ${{ github.event.inputs.vnc_password }}
        run: |
          mkdir -p "$HOME/.vnc"

          printf "%s\n" "$VNC_PASSWORD" | \
            vncpasswd -f > "$HOME/.vnc/passwd"

          chmod 600 "$HOME/.vnc/passwd"

          cat > "$HOME/.vnc/xstartup" <<'EOF'
          #!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          exec startxfce4
          EOF

          chmod +x "$HOME/.vnc/xstartup"

      - name: Instalar ngrok
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          curl -sSL \
            https://ngrok-agent.s3.amazonaws.com/ngrok.asc \
            | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null

          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" \
            | sudo tee /etc/apt/sources.list.d/ngrok.list

          sudo apt-get update
          sudo apt-get install -y ngrok

          ngrok config add-authtoken "$NGROK_AUTHTOKEN"

      - name: Iniciar VNC
        run: |
          vncserver :1 \
            -geometry 1280x720 \
            -depth 24 \
            -localhost yes

      - name: Criar túnel
        run: |
          ngrok tcp 5901 \
            --log stdout \
            > /tmp/ngrok.log 2>&1 &

          sleep 8

          echo "===== NGROK ====="
          cat /tmp/ngrok.log

      - name: Manter ambiente para teste
        run: |
          echo "Ambiente gráfico iniciado."
          echo "Este runner é temporário e destinado a desenvolvimento/teste."

          sleep 3600
